[pytest]
addopts = -s -v
python_files = *_tests.py test_*.py
python_classes = Test*
python_functions = test_*
markers =
    authentication: Маркировка для тестов, связанных с аутентификацией
    register: Маркировка для тестов, связанных с регистрацией
    login: Маркировка для тестов, связанных с авторизацией
    users: Маркировка для тестов, связанных с пользователями
    projects: Маркировка для тестов, связанных с проектами
    project: Маркировка для тестов, связанных с проектом
    tasks: Маркировка для тестов, связанных с задачами
    task: Маркировка для тестов, связанных с задачей
    attachments: Маркировка для тестов, связанных с вложениями
    comments: Маркировка для тестов, связанных с комментариями
    regression: Маркировка для регрессионных тестов
    api: Маркировка для тестов API
    ui: Маркировка для тестов UI
